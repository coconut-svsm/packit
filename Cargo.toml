[package]
name = "packit"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "packit"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"], optional = true }
memmap2 = { version = "0.7.0", optional = true }
zerocopy = { version = "0.8.27", features = ["derive"] }

[features]
default = []
alloc = []
std = ["alloc", "dep:memmap2"]
cli = ["std", "dep:clap"]
